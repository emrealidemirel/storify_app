name: flutter_story_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.7.0

flutter_icons:
  ios: true
  image_path: "assets/images/storify_icon_with_bg.png" 
  
  android: "launcher_icon" 
  adaptive_icon_background: "#FFF3E0" 
  adaptive_icon_foreground: "assets/images/storify_icon.png"
  min_sdk_android: 21 

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  http: ^1.3.0
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  easy_localization: ^3.0.7+1
  shared_preferences: ^2.5.3
  responsive_sizer: ^3.3.1
  dio: ^5.8.0+1
  chat_gpt_sdk: ^3.1.5
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  google_sign_in: ^6.3.0
  image_picker: ^1.1.2
  firebase_storage: ^12.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  assets:
    - assets/images/
    - assets/langs/
    - .env

  uses-material-design: true