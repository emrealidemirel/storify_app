name: flutter_story_app
description: "Interactive stories in Turkish and English."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/storify_icon_with_bg.png"

  android: "launcher_icon"
  adaptive_icon_background: "#302019"
  adaptive_icon_foreground: "assets/images/storify_icon_with_bg.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/storify_icon_with_bg.png"
    background_color: "#302019"
    theme_color: "#302019"
  macos:
    generate: true
    image_path: "assets/images/storify_icon_with_bg.png"
  windows:
    generate: true
    image_path: "assets/images/storify_icon_with_bg.png"
    icon_size: 256
  min_sdk_android: 21

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.0
  equatable: ^3.0.0
  easy_localization: ^3.0.7+1
  shared_preferences: ^2.5.3
  responsive_sizer: ^3.3.1
  chat_gpt_sdk: ^3.1.5
  flutter_dotenv: ^6.0.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  http: ^1.3.0
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/fonts/Cinzel-OFL.txt
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/NunitoSans-OFL.txt
    - assets/images/
    - assets/langs/
    - assets/stories/
    - .env

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf

  uses-material-design: true
